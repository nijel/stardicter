[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=78.0.2"
]

[dependency-groups]
dev = [
  { include-group = "test" }
]
test = [
  "pytest",
  "pytest-cov"
]

[project]
authors = [
  { name = "Michal Čihař", email = "michal@cihar.com" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15"
]
dependencies = []
description = "Conversion tools from various formats to StarDict."
keywords = [
  "stardict",
  "dictionary"
]
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
name = "stardicter"
readme = "README.rst"
requires-python = ">=3.11"
version = "2.0.2"

[project.scripts]
sdgen = "stardicter.main:main"

[project.urls]
Download = "https://pypi.python.org/pypi/stardicter"
Homepage = "https://cihar.com/software/slovnik/"

[tool.check-manifest]
ignore = [
  "*.json",
  "*.yml",
  "*.yaml"
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-safe-fixes = [
  "D",
  "TCH",
  "FLY",
  "SIM",
  "ANN",
  "future-required-type-annotation",
  "literal-membership",
  "write-whole-file",
  "UP"
]
ignore = [
  "ANN",  # TODO: type annotations
  "magic-value-comparison",  # TODO: Magic value used in comparison,
  "raise-vanilla-args",  # TODO: Avoid specifying long messages outside the exception class
  "f-string-in-exception",  # TODO: Exception must not use an f-string literal
  "raw-string-in-exception",  # TODO: Exception must not use a string literal
  "too-many-arguments",  # TODO: Too many arguments in function definition
  "too-many-positional-arguments",  # TODO: Too many positional arguments
  "non-imperative-mood",  # TODO: First line of docstring should be in imperative mood
  "compare-to-empty-string",  # TODO: string boolean condition
  "missing-copyright-notice",  # TODO: copyright notices
  "COM",  # CONFIG: No trailing commas
  "PT",  # CONFIG: Not using pytest
  "D10",  # TODO: we are missing many docstrings
  "incorrect-blank-line-before-class",  # CONFIG: incompatible with D211
  "multi-line-summary-first-line",  # CONFIG: incompatible with D213
  'single-line-implicit-string-concatenation',  # CONFIG: formatter
  "PTH",  # TODO: Not using pathlib
  "unused-method-argument",  # TODO: Unused method argument (mostly for API compatibility)
  "DOC",  # CONFIG: Using type annotations instead
  "no-self-use",  # TODO: Method could be a function, class method, or static method
  "open-file-with-context-handler",  # TODO: Use a context manager for opening files
  "boolean-default-value-positional-argument",  # TODO: Boolean default positional argument in function definition
  "boolean-positional-value-in-call",  # TODO: Boolean positional value in function call
  "write-whole-file",  # TODO: `open` and `write` should be replaced by `Path(filename)....`
  "unspecified-encoding",  # TODO: `open` in text mode without explicit `encoding` argument
  "line-too-long"  # WONTFIX: we accept long strings (rest is formatted by black)
]
preview = true
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"stardicter/deaccent.py" = ["ambiguous-unicode-character-comment"]
"stardicter/main.py" = ["print"]

[tool.setuptools]
include-package-data = false
packages = [
  "stardicter"
]
platforms = [
  "any"
]

[tool.setuptools.package-data]
stardicter = [
  "test_*.txt"
]

[tool.setuptools.package-dir]
stardicter = "stardicter"
